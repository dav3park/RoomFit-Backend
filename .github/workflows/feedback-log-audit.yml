name: Read-only consultation log audit
on:
  push:
    branches: [codex/feedback-log-audit-20261013]
permissions:
  contents: read
jobs:
  read-consultation-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact consultation request metadata
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            # Read bounded metadata only. No deployment, restart, DB writes or environment/provider-content dump.
            docker inspect --format 'startedAt={{.State.StartedAt}}' roomfit-backend
            docker logs --timestamps --since '2026-10-18T17:25:00+09:00' --until '2026-10-18T18:30:00+09:00' roomfit-backend 2>&1 | awk '
              /design_consultation_failure|design_consultation_repair/ || /http_request/ && /consultation-fix-20261018/ { print; matched++ }
              END { printf "audit_matched_lines=%d\n", matched }
            '
